<svg xmlns="http://www.w3.org/2000/svg" width="201" height="201" viewBox="0 0 201 201" fill="none">
  <!-- Define filters for premium drop shadow -->
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#003114" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Rotated Badge Card -->
  <g transform="rotate(-6 100 100)" filter="url(#card-shadow)">
    <!-- White card with green border -->
    <rect x="52" y="32" width="96" height="136" rx="14" fill="#FFFFFF" stroke="#006837" stroke-width="7"/>
    <!-- Clip slot at the top -->
    <rect x="85" y="44" width="30" height="7" rx="3.5" fill="#006837"/>
    <!-- Avatar head -->
    <circle cx="100" cy="94" r="19" fill="#006837"/>
    <!-- Avatar torso -->
    <path d="M68 152 C 68 128, 132 128, 132 152 Z" fill="#006837"/>
  </g>

  <!-- Green Checkmark Circle overlapping bottom-right -->
  <circle cx="140" cy="148" r="21" fill="#006837" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="140" cy="148" r="18" fill="#1dca63"/>
  <!-- Checkmark icon -->
  <path d="M132 148 L137.5 153.5 L148 141.5" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
